# Postgres local para desarrollo y tests del backend anticheat.
# Mapeado a 5435 en el host para no chocar con un PostgreSQL nativo en 5432.
# DATABASE_URL en .env debe apuntar a: postgres:anticheat@localhost:5435/anticheat.
services:
  postgres:
    image: postgres:16-alpine
    container_name: anticheat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: anticheat
      POSTGRES_DB: anticheat
    ports:
      - '5435:5432'
    volumes:
      - anticheat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d anticheat']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anticheat-pgdata:
